# Throwaway probe P-5 (docs/projects/260918_backend-abstraction). Not packaged.
[package]
name = "zbterm-signalling"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
freenet-stdlib = "=0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
contract = ["freenet-stdlib/contract"]
default = ["freenet-main-contract"]
freenet-main-contract = ["contract"]
trace = ["freenet-stdlib/trace"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]

name: Publish
on:
  push:
    tags:
      - v*
permissions:
  contents: read
jobs:
  # Publishing is gated on the full Integrate workflow - lint plus the
  # cross-platform `npm install -g` matrix - running against exactly this tag.
  # A tarball that does not install cleanly cannot reach npm.
  integrate:
    uses: ./.github/workflows/integrate.yml

  # The Rust zxterm-core sidecar, built from the zxterm/ submodule for every
  # target in scripts/sidecar.js#TARGETS, each on its own native runner.
  # Linux builds on ubuntu-22.04 so the binary needs no newer glibc than 2.35.
  sidecar:
    name: Sidecar ${{ matrix.dir }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { triple: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, dir: linux-x64 }
          - { triple: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm, dir: linux-arm64 }
          - { triple: x86_64-apple-darwin, runner: macos-26-intel, dir: darwin-x64 }
          - { triple: aarch64-apple-darwin, runner: macos-latest, dir: darwin-arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust toolchain (zxterm/rust-toolchain.toml)
        working-directory: zxterm
        run: rustup show active-toolchain
      - name: Build and stage
        run: node scripts/sidecar.js build ${{ matrix.triple }}
      - name: Smoke test
        run: npm/zxterm-core-${{ matrix.dir }}/zxterm-core --version
      - uses: actions/upload-artifact@v4
        with:
          name: zxterm-core-${{ matrix.dir }}
          path: npm/zxterm-core-${{ matrix.dir }}/zxterm-core
          if-no-files-found: error

  # The platform packages first, then zbterm, whose optionalDependencies are
  # written only here (scripts/sidecar.js inject), pinned to this version.
  # Uses npm trusted publishing (OIDC): configure this repository and
  # workflow as a trusted publisher of zbterm and of each
  # @zbterm/zxterm-core-* package on npmjs.com, or set an NPM_TOKEN secret
  # in the `npm` environment for the first release.
  publish:
    needs: [integrate, sidecar]
    runs-on: ubuntu-latest
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: holepunchto/actions/node-base@v1
        with:
          allow-git: all
      - name: Check out the zxterm submodule
        run: git submodule update --init --depth 1 zxterm
      - name: npm with trusted publishing
        run: npm install -g npm@11
      - name: Check the tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: zxterm-core-*
          path: artifacts
      - name: Publish the sidecar packages
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          for dir in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            node scripts/sidecar.js stage "$dir" "artifacts/zxterm-core-$dir/zxterm-core"
            name="$(node -p "require('./npm/zxterm-core-$dir/package.json').name")"
            # A re-run after a failed zbterm publish skips what is already up.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            (cd "npm/zxterm-core-$dir" && npm publish --provenance --access public)
          done
      - name: Publish zbterm
        run: |
          node scripts/sidecar.js inject
          npm publish --provenance --access public
